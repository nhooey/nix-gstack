# Garnix CI configuration. https://garnix.io/docs/ci/yaml_config/
#
# Single coarse wildcard covers every flake output for x86_64-linux:
# `checks.x86_64-linux.*`, `devShells.x86_64-linux.*`,
# `packages.x86_64-linux.*`. Add `*.aarch64-linux.*` / `*.x86_64-darwin.*`
# / `*.aarch64-darwin.*` rows when ready to expand the matrix.
builds:
  include:
    - "*.x86_64-linux.*"
  exclude: []
