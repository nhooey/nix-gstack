# Garnix CI configuration. https://garnix.io/docs/ci/yaml_config/
#
# Scoped to x86_64-linux while the hermetic FOD's per-system node_modules
# hashes are still being populated — see nix/gstack.nix `nodeModulesHash`.
# Re-add the other systems' rows as their hashes get pinned.
builds:
  include:
    - "checks.x86_64-linux.*"
    - "devShells.x86_64-linux.default"
    - "packages.x86_64-linux.gstack"
  exclude: []
